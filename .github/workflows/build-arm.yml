name: Build Native ELPL Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'programminglanguage'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            archive: ELPL-mac-arm64.zip
            binary: elpl
          - os: ubuntu-latest
            target: linux-x64
            archive: elpl-linux-x64.tar.gz
            binary: elpl
          - os: windows-latest
            target: windows-x64
            archive: ELPL-windows-x64.zip
            binary: elpl

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm-community'
          java-version: '17'

      - name: Set up MSVC Environment (Windows)
        if: matrix.target == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify elpl.jar Exists
        shell: bash
        run: |
          if [ ! -f "elpl.jar" ]; then
            echo "❌ Error: elpl.jar not found in repository root!"
            exit 1
          fi
          echo "✅ elpl.jar found successfully."

      - name: Build Native Image
        shell: bash
        run: |
          if [ "${{ matrix.target }}" == "windows-x64" ]; then
            native-image.cmd --no-fallback -jar elpl.jar ${{ matrix.binary }}
          else
            native-image --no-fallback -jar elpl.jar ${{ matrix.binary }}
          fi

      - name: Package into Archive
        shell: bash
        run: |
          mkdir -p dist/bin
          if [ "${{ matrix.target }}" == 'windows-x64' ]; then
            cp ${{ matrix.binary }}.exe dist/bin/${{ matrix.binary }}.exe
          else
            cp ${{ matrix.binary }} dist/bin/${{ matrix.binary }}
            chmod +x dist/bin/${{ matrix.binary }}
          fi
          cd dist
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            zip -r ../${{ matrix.archive }} bin
          else
            tar -czf ../${{ matrix.archive }} bin
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          tag_name: programminglanguage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
