name: Build ELPL SDK Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'programminglanguage'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            archive: ELPL-mac-arm64.zip
            binary: elpl
          - os: ubuntu-latest
            target: linux-x64
            archive: elpl-linux-x64.tar.gz
            binary: elpl
          - os: windows-latest
            target: windows-x64
            archive: ELPL-windows-x64.zip
            binary: elpl.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Fat JAR with ASM
        shell: bash
        run: |
          mkdir -p out
          find . -name "*.java" > sources.txt
          javac -cp "lib/asm-9.7.1.jar:lib/asm-tree-9.7.jar" -d out @sources.txt
          rm sources.txt
          
          jar cfm elplc.jar MANIFEST.MF -C out .
          
          TEMP_ASM=$(mktemp -d)
          jar xf lib/asm-9.7.1.jar -C "$TEMP_ASM"
          jar xf lib/asm-tree-9.7.jar -C "$TEMP_ASM" 2>/dev/null || true
          jar xf lib/asm-tree-9.7.jar -C "$TEMP_ASM" 2>/dev/null || true
          rm -rf "$TEMP_ASM/META-INF"
          jar uf elplc.jar -C "$TEMP_ASM" .
          rm -rf "$TEMP_ASM"

      - name: Compile C Launcher (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          gcc elpl_launcher.c -o elpl \
            -I"$JAVA_HOME/include" \
            -I"$JAVA_HOME/include/linux" \
            -L"$JAVA_HOME/lib/server" \
            -ljvm \
            -Wl,-rpath,"$JAVA_HOME/lib/server"

      - name: Compile C Launcher (macOS)
        if: startsWith(matrix.target, 'mac')
        run: |
          clang elpl_launcher.c -o elpl \
            -I"$JAVA_HOME/include" \
            -I"$JAVA_HOME/include/darwin" \
            -L"$JAVA_HOME/lib/server" \
            -ljvm \
            -Wl,-rpath,"$JAVA_HOME/lib/server"

      - name: Compile C Launcher (Windows)
        if: matrix.target == 'windows-x64'
        shell: bash
        run: |
          gcc elpl_launcher.c -o elpl.exe \
            -I"$JAVA_HOME/include" \
            -I"$JAVA_HOME/include/win32" \
            -L"$JAVA_HOME/lib" \
            -L"$JAVA_HOME/lib/server" \
            -ljvm

      - name: Package into Archive
        shell: bash
        run: |
          mkdir -p dist/bin dist/lib/elplc
          cp ${{ matrix.binary }} dist/bin/${{ matrix.binary }}
          cp elplc.jar dist/lib/elplc/elplc.jar
          if [ "${{ matrix.target }}" != 'windows-x64' ]; then
            chmod +x dist/bin/${{ matrix.binary }}
          fi
          cd dist
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            zip -r ../${{ matrix.archive }} bin lib
          else
            tar -czf ../${{ matrix.archive }} bin lib
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          tag_name: programminglanguage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
